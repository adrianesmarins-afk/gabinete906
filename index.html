<script>
var G={gkey:'',akey:'',fid:'1PLAXpMXn3k4JRc187IGzLViJ8EBDcKAd',docs:[],minuta:'',voto2:''};

var REGRAS_DRIVE=`INSTRUÇÕES SOBRE OS DOCUMENTOS DE REFERÊNCIA DO DRIVE:
Os documentos Word do gabinete contêm anotações internas em cores diferentes do preto (vermelho, azul, verde, amarelo destacado etc.). Essas anotações são comentários dos assistentes e NÃO fazem parte do voto oficial.
REGRA: Ignore COMPLETAMENTE qualquer trecho que, no documento original, esteja em cor diferente de preto ou com destaque colorido. Use apenas o texto em preto/automático como modelo.
A minuta nova deve replicar a estrutura, formatação (Times New Roman), espaçamento e linguagem dos trechos em preto, preenchendo os campos com os dados do processo atual.`;

var REGRAS=`ESTRUTURA OBRIGATÓRIA DO RELATÓRIO:
§1 - Tipo de recurso e decisão recorrida (resumido).
§2 - Resumo das razões recursais.
§3 - Somente se houver recurso adesivo ou simultâneo.
§ FINAL - Redigir exatamente: "Recurso recebido, em seu efeito [devolutivo/suspensivo], [preparado / sem preparo diante da gratuidade concedida / sem preparo diante do pedido de gratuidade] e [com / sem] resposta."
FUNDAMENTAÇÃO: apenas preliminares (se houver) + mérito. NÃO mencionar admissibilidade.
FORMATAÇÃO: Times New Roman, mesmo tamanho e espaçamento dos documentos de referência.
IGNORAR todo texto colorido ou destacado nos documentos de referência (são anotações internas).
Usar sempre o entendimento do documento mais recente como referência prioritária.`;

// Config
function salvar(){
  G.gkey=document.getElementById('gkey').value.trim();
  G.akey=document.getElementById('akey').value.trim();
  G.fid=document.getElementById('fid').value.trim()||'1PLAXpMXn3k4JRc187IGzLViJ8EBDcKAd';
  document.getElementById('cfg-body').classList.remove('open');
  conectar();
}

async function conectar(){
  if(!G.gkey){setDot(false,'Insira a API Key do Google Cloud nas configurações');return;}
  setDot(false,'Conectando ao Drive...');
  try{
    var url='https://www.googleapis.com/drive/v3/files'
      +'?q=%27'+G.fid+'%27+in+parents'
      +'+and+mimeType%3D%27application%2Fvnd.openxmlformats-officedocument.wordprocessingml.document%27'
      +'+and+trashed%3Dfalse'
      +'&fields=files(id%2Cname%2CmodifiedTime)&orderBy=modifiedTime+desc&pageSize=200&key='+G.gkey;
    var r=await fetch(url);
    if(!r.ok) throw new Error('Erro HTTP '+r.status);
    var d=await r.json();
    G.docs=d.files||[];
    document.getElementById('n-total').textContent=G.docs.length;
    document.getElementById('n-recente').textContent=G.docs.length?(G.docs[0].modifiedTime||'').slice(0,10):'—';
    document.getElementById('stats').style.display='grid';
    setDot(true,'Drive conectado — '+G.docs.length+' documentos carregados');
  }catch(e){
    setDot(false,'Erro ao conectar: '+e.message);
  }
}

function setDot(ok,msg){
  document.getElementById('dot').className='dot'+(ok?' on':'');
  document.getElementById('status-txt').textContent=msg;
}

// Upload
function onDrop(e){
  e.preventDefault();
  var f=e.dataTransfer.files[0];
  if(f&&f.type==='application/pdf') iniciar(f);
}

async function iniciar(file){
  if(!file) return;
  if(!G.akey){alert('Configure a API Key da Anthropic antes de continuar.');return;}
  document.getElementById('uzone').style.display='none';
  document.getElementById('ra').innerHTML='';
  document.getElementById('pw').style.display='block';
  document.getElementById('triagem').style.display='none';
  resetTriagem();

  prog(8,'Lendo o PDF...');
  await sleep(400);

  // PDF completo para geração da minuta
  var b64Completo=await toBase64(file);

  // Extrai texto das primeiras páginas para triagem (evita limite de tokens)
  var textoTriagem=await extrairTextoPDF(file);

  prog(18,'Enviando para análise...');
  await sleep(300);

  // ETAPA ÚNICA: Triagem completa em uma chamada
  var promptTriagem=`Você é o assistente jurídico do Desembargador Décio Rodrigues, 21ª Câmara de Direito Privado do TJSP.

Leia o PDF do processo anexo e realize a análise completa. Responda APENAS com JSON válido neste formato exato, sem texto adicional:

{
  "tipo_recurso": "Apelação|Agravo de Instrumento|Embargos de Declaração|Agravo Interno|Decisão Monocrática|Outro",
  "partes": "Apelante/Apelado ou Agravante/Agravado",
  "numero_processo": "número completo",
  "comarca": "comarca de origem",
  "materia": "matéria jurídica principal do recurso",
  "gratuidade": "concedida|pedida|sem gratuidade",
  "preparo": "preparado|sem preparo diante da gratuidade concedida|sem preparo diante do pedido de gratuidade",
  "resposta": "com resposta|sem resposta",
  "efeito": "devolutivo|suspensivo",
  "competencia": {
    "resultado": "COMPETENTE|INCOMPETENTE",
    "camara_correta": "nome da câmara/subseção correta se incompetente, null se competente",
    "motivo": "breve justificativa"
  },
  "repetitivo": {
    "resultado": "SUSPENSO|NAO_SUSPENSO",
    "tema": "número e nome do tema se suspenso, null se não",
    "tribunal": "STJ|STF|IRDR-TJSP se suspenso, null se não",
    "motivo": "breve justificativa"
  },
  "admissibilidade": {
    "resultado": "ADMISSIVEL|INADMISSIVEL",
    "motivo": "motivo se inadmissível, null se admissível"
  }
}

REGRAS DE COMPETÊNCIA (Res. 623/2013 TJSP — 2ª Subseção = 11ª a 24ª Câmaras):
COMPETENTE: contratos bancários, financiamentos, cartão de crédito, CDC bancário, empréstimo, mútuo, alienação fiduciária de veículo (busca e apreensão), consórcio, execução em título extrajudicial, sustação de protesto, comodato, transporte, depósito mercantil, possessória de imóvel, servidão, energia elétrica, telefonia, água, gás, prestação de serviços, superendividamento.
INCOMPETENTE → 1ª Subseção (1ª-10ª Câmaras): família, divórcio, alimentos, inventário, herança, usucapião, registros públicos, plano de saúde, seguro-saúde, seguro habitacional, direito autoral, reivindicação de imóvel.
INCOMPETENTE → 3ª Subseção (25ª-36ª Câmaras): condomínio, locação de imóvel, acidente de veículo, previdência privada, seguro de vida/dano, honorários advocatícios, arrendamento rural, bem móvel.
INCOMPETENTE → Direito Público: tributário, ICMS, TUST, TUSD, servidor público, fazenda pública, desapropriação, responsabilidade civil do estado, previdência social/INSS.
INCOMPETENTE → Câmaras Empresariais: falência, recuperação judicial, sociedades, propriedade industrial, marcas, patentes.

REGRAS DE REPETITIVO/IRDR: Verifique se a matéria está com julgamento suspenso por Repetitivo STJ/STF ou IRDR do TJSP. Considere os principais temas de contratos bancários, CDC, seguros e prestação de serviços.`;

  prog(30,'Analisando competência, Repetitivos e admissibilidade...');

  var triagem;
  try{
    var r1=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':G.akey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:800,
        messages:[{role:'user',content:[
          {type:'text',text:'TEXTO DO PROCESSO (primeiras páginas):\n'+textoTriagem+'\n\n'+promptTriagem}
        ]}]
      })
    });
    var d1=await r1.json();
    if(d1.error) throw new Error(d1.error.message);
    var txt=(d1.content||[]).map(function(b){return b.text||'';}).join('').replace(/```json|```/g,'').trim();
    triagem=JSON.parse(txt);
  }catch(e){
    mostrarErro('Erro na triagem: '+e.message);return;
  }

  // Mostra painel de triagem com resultados
  document.getElementById('pw').style.display='none';
  document.getElementById('triagem').style.display='block';
  mostrarTriagem(triagem);

  await sleep(600);

  // Decide o fluxo
  if(triagem.competencia.resultado==='INCOMPETENTE'){
    await gerarIncompetencia(triagem,b64);
    return;
  }
  if(triagem.repetitivo.resultado==='SUSPENSO'){
    await gerarSuspensao(triagem,b64);
    return;
  }
  if(triagem.admissibilidade.resultado==='INADMISSIVEL'){
    await gerarNaoConhecimento(triagem,b64);
    return;
  }

  // Admitido — gera mérito
  await gerarMerito(triagem,b64);
}

function mostrarTriagem(t){
  // Identificação
  setTItem('tipo','✅',t.tipo_recurso+' · '+t.partes,'b-ok','Identificado');
  // Competência
  var cOk=t.competencia.resultado==='COMPETENTE';
  setTItem('comp',cOk?'✅':'❌',t.competencia.motivo,cOk?'b-ok':'b-err',cOk?'Competente':'Incompetente');
  // Repetitivo
  if(t.competencia.resultado==='COMPETENTE'){
    var rOk=t.repetitivo.resultado==='NAO_SUSPENSO';
    setTItem('rep',rOk?'✅':'⚠️',t.repetitivo.motivo,rOk?'b-ok':'b-warn',rOk?'Não suspenso':'Suspenso — '+t.repetitivo.tribunal);
  }
  // Admissibilidade
  if(t.competencia.resultado==='COMPETENTE'&&t.repetitivo.resultado==='NAO_SUSPENSO'){
    var aOk=t.admissibilidade.resultado==='ADMISSIVEL';
    setTItem('adm',aOk?'✅':'❌',aOk?'Pressupostos recursais verificados':t.admissibilidade.motivo,aOk?'b-ok':'b-err',aOk?'Admissível':'Inadmissível');
  }
  // Documento
  setTItem('doc','🔄','Consultando banco de dados do Drive e elaborando minuta...','b-load','Em elaboração');
}

function setTItem(key,ico,sub,badgeClass,badgeTxt){
  document.getElementById('ico-'+key).textContent=ico;
  document.getElementById('sub-'+key).textContent=sub;
  var b=document.getElementById('badge-'+key);
  b.textContent=badgeTxt;
  b.className='t-badge '+badgeClass;
}

async function buscarRefs(tipo){
  // Busca os documentos mais relevantes do Drive (mais recentes primeiro, já ordenado)
  var relevantes=G.docs.filter(function(d){
    var n=d.name.toLowerCase();
    if(tipo==='Agravo de Instrumento') return n.includes('ag')||n.includes('agravo')||n.includes('desp');
    if(tipo==='Embargos de Declaração') return n.includes('emb')||n.includes('embargo');
    if(tipo==='Agravo Interno') return n.includes('ai')||n.includes('interno');
    return true; // Para apelação e outros usa todos
  });
  // Pega os 3 mais recentes relevantes, senão os 3 primeiros da base
  var selecionados=(relevantes.length?relevantes:G.docs).slice(0,3);
  var txt='';
  for(var i=0;i<selecionados.length;i++){
    try{
      var t=await lerWord(selecionados[i].id);
      txt+='\n\n--- REFERÊNCIA: '+selecionados[i].name+' ('+( selecionados[i].modifiedTime||'').slice(0,10)+') ---\n'+t.slice(0,700);
    }catch(e){}
  }
  return {txt:txt,docs:selecionados};
}

async function buscarSuspensoes(){
  var susps=G.docs.filter(function(d){
    var n=d.name.toLowerCase();
    return n.includes('suspens')||n.includes('sobresta')||n.includes('repetit')||n.includes('irdr');
  }).slice(0,3);

async function chamarAPI(prompt,b64){
  var resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':G.akey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:3000,
      messages:[{role:'user',content:[
        {type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},
        {type:'text',text:prompt}
      ]}]
    })
  });
  var d=await resp.json();
  if(d.error) throw new Error(d.error.message);
  return (d.content||[]).map(function(b){return b.text||'';}).join('');
}

function exportar(qual,nome){
  var texto=qual==='voto2'?G.voto2:G.minuta;
  var rtf='{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Times New Roman;}}{\\colortbl;\\red0\\green0\\blue0;}\\f0\\fs24\\qj ';
  texto.split('\n').forEach(function(l){
    rtf+=l.replace(/\\/g,'\\\\').replace(/\{/g,'\\{').replace(/\}/g,'\\}')+'\\par ';
  });
  rtf+='}';
  var blob=new Blob([rtf],{type:'application/rtf'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=nome+'.rtf';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}

async function lerWord(id){
  var r=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media&key='+G.gkey);
  if(!r.ok) throw new Error('erro');
  var buf=await r.arrayBuffer();
  var res=await mammoth.extractRawText({arrayBuffer:buf});
  return res.value||'';
}

function toBase64(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(e){
      var s=e.target.result;
      var b64=s.indexOf(',')>=0?s.split(',')[1]:s;
      res(b64.replace(/\s/g,''));
    };
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

// Extrai texto das primeiras 15 páginas do PDF usando PDF.js
async function extrairTextoPDF(file){
  try{
    var buf=await file.arrayBuffer();
    var pdf=await pdfjsLib.getDocument({data:buf}).promise;
    var numPags=Math.min(pdf.numPages,15);
    var texto='';
    for(var i=1;i<=numPags;i++){
      var pag=await pdf.getPage(i);
      var content=await pag.getTextContent();
      texto+=content.items.map(function(it){return it.str;}).join(' ')+'\n';
    }
    // Limita a 8000 caracteres para não estourar tokens
    return texto.slice(0,8000);
  }catch(e){
    console.warn('PDF.js falhou, usando fallback:',e);
    // Fallback: leitura binária simples
    return await lerPDFSimples(file);
  }
}

async function lerPDFSimples(file){
  return new Promise(function(res){
    var r=new FileReader();
    r.onload=function(e){
      var b=new Uint8Array(e.target.result),t='';
      for(var i=0;i<Math.min(b.length,50000);i++){
        if(b[i]>=32&&b[i]<127)t+=String.fromCharCode(b[i]);
        else if(b[i]===10||b[i]===13)t+='\n';
      }
      res(t.replace(/ {3,}/g,' ').slice(0,8000));
    };
    r.readAsArrayBuffer(file);
  });
}
